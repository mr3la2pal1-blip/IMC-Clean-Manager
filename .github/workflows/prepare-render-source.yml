name: Prepare project source for Render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack-project:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack application source
        run: |
          unzip -o IMC-Clean-Manager-APK-Ready.zip -d .
          test -f package.json
          test -f server.ts
          test -f render.yaml
      - name: Align esbuild with Vite 8
        run: |
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          node -e "const p=require('./package.json'); if (!p.devDependencies.esbuild.startsWith('^0.28')) process.exit(1)"
      - name: Replace ZIP download link with APK release link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/components/PWAInstallButton.tsx")
          s = p.read_text()
          s = s.replace('href="/api/project-zip"', 'href="https://github.com/mr3la2pal1-blip/IMC-Clean-Manager/releases/latest/download/app-debug.apk"')
          s = s.replace('download="IMC-Clean-Manager.zip"', 'download="IMC-Clean-Manager.apk"')
          s = s.replace('title="تنزيل ملف المشروع بصيغة ZIP"', 'title="تنزيل تطبيق أندرويد بصيغة APK"')
          s = s.replace('تنزيل التطبيق (ZIP)', 'تنزيل التطبيق (APK)')
          if "releases/latest/download/app-debug.apk" not in s or "تنزيل التطبيق (APK)" not in s:
              raise SystemExit("APK download button patch did not apply")
          p.write_text(s)
          PY
      - name: Commit source files to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Prepare project source for Render [skip ci]"
          git push
