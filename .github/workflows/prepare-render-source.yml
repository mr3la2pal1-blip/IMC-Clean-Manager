name: Prepare project source for Render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preserve current account-management updates
        run: |
          mkdir -p /tmp/imc-preserve
          mkdir -p /tmp/imc-preserve/components
          cp server/routes.ts /tmp/imc-preserve/routes.ts
          cp server/db.ts /tmp/imc-preserve/db.ts
          cp src/api.ts /tmp/imc-preserve/api.ts
          cp src/types.ts /tmp/imc-preserve/types.ts
          cp src/App.tsx /tmp/imc-preserve/App.tsx
          cp src/components/AdminManagementView.tsx /tmp/imc-preserve/AdminManagementView.tsx
          cp src/components/ShiftHandoversView.tsx /tmp/imc-preserve/ShiftHandoversView.tsx
          cp src/components/DepartmentQRGrid.tsx /tmp/imc-preserve/DepartmentQRGrid.tsx
          cp src/components/LiveMonitorView.tsx /tmp/imc-preserve/LiveMonitorView.tsx
          cp src/components/ReportsView.tsx /tmp/imc-preserve/ReportsView.tsx
          cp src/components/WorkerNotesView.tsx /tmp/imc-preserve/WorkerNotesView.tsx
      - name: Unpack application source
        run: |
          unzip -o IMC-Clean-Manager-APK-Ready.zip -d .
          test -f package.json
          test -f server.ts
          test -f render.yaml
      - name: Restore account-management updates after ZIP extraction
        run: |
          cp /tmp/imc-preserve/routes.ts server/routes.ts
          cp /tmp/imc-preserve/db.ts server/db.ts
          cp /tmp/imc-preserve/api.ts src/api.ts
          cp /tmp/imc-preserve/types.ts src/types.ts
          cp /tmp/imc-preserve/App.tsx src/App.tsx
          cp /tmp/imc-preserve/AdminManagementView.tsx src/components/AdminManagementView.tsx
          cp /tmp/imc-preserve/ShiftHandoversView.tsx src/components/ShiftHandoversView.tsx
          cp /tmp/imc-preserve/DepartmentQRGrid.tsx src/components/DepartmentQRGrid.tsx
          cp /tmp/imc-preserve/LiveMonitorView.tsx src/components/LiveMonitorView.tsx
          cp /tmp/imc-preserve/ReportsView.tsx src/components/ReportsView.tsx
          cp /tmp/imc-preserve/WorkerNotesView.tsx src/components/WorkerNotesView.tsx
      - name: Align esbuild with Vite 8
        run: |
          npm pkg set 'devDependencies.esbuild=^0.28.2'
          node -e "const p=require('./package.json'); if (!p.devDependencies.esbuild.startsWith('^0.28')) process.exit(1)"
      - name: Replace ZIP download link with APK release link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/components/PWAInstallButton.tsx")
          s = p.read_text()
          s = s.replace('href="/api/project-zip"', 'href="https://github.com/mr3la2pal1-blip/IMC-Clean-Manager/releases/latest/download/app-debug.apk"')
          s = s.replace('download="IMC-Clean-Manager.zip"', 'download="IMC-Clean-Manager.apk"')
          s = s.replace('title="تنزيل ملف المشروع بصيغة ZIP"', 'title="تنزيل تطبيق أندرويد بصيغة APK"')
          s = s.replace('تنزيل التطبيق (ZIP)', 'تنزيل التطبيق (APK)')
          if "releases/latest/download/app-debug.apk" not in s or "تنزيل التطبيق (APK)" not in s:
              raise SystemExit("APK download button patch did not apply")
          p.write_text(s)
          PY
      - name: Add shift-specific worker contact numbers
        run: |
          python - <<'PY'
          from pathlib import Path
          def patch(path, replacements):
              p = Path(path)
              content = p.read_text()
              for old, new in replacements:
                  if old not in content:
                      raise SystemExit(f"Could not apply shift-phone patch to {path}: missing {old[:80]!r}")
                  content = content.replace(old, new)
              p.write_text(content)

          patch("server/db.ts", [
              ("    shift_type TEXT NOT NULL,\n    status TEXT NOT NULL CHECK", "    shift_type TEXT NOT NULL,\n    phone TEXT,\n    status TEXT NOT NULL CHECK"),
              ("`);\n\nexport function getOrCreateSessionSecret()", "`);\n\n// Add shift-specific contact numbers to existing databases without losing records.\nconst workerShiftColumns = db.pragma('table_info(worker_shifts)') as Array<{name: string}>;\nif (!workerShiftColumns.some((column) => column.name === 'phone')) {\n  db.exec('ALTER TABLE worker_shifts ADD COLUMN phone TEXT');\n}\n\nexport function getOrCreateSessionSecret()"),
          ])
          patch("server/routes.ts", [
              ("            shift_type: string;\n            status: 'نشط' | 'غائب' | 'مكتمل';", "            shift_type: string;\n            phone: string | null;\n            status: 'نشط' | 'غائب' | 'مكتمل';"),
              ("          shiftType: s.shift_type,\n          status: s.status,", "          shiftType: s.shift_type,\n          phone: s.phone ?? null,\n          status: s.status,"),
              ("      const shiftType = sanitizeText(req.body?.shiftType, 60);\n      const status", "      const shiftType = sanitizeText(req.body?.shiftType, 60);\n      const phone = sanitizeText(req.body?.phone, 40) || null;\n      const status"),
              ("`INSERT INTO worker_shifts (id, worker_id, shift_date, shift_type, status, notes, recorded_by_id, created_at)\n           VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,\n        ).run(id, worker.id, shiftDate, shiftType, status, notes, actor.id, now);", "`INSERT INTO worker_shifts (id, worker_id, shift_date, shift_type, phone, status, notes, recorded_by_id, created_at)\n           VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?)`,\n        ).run(id, worker.id, shiftDate, shiftType, phone, status, notes, actor.id, now);"),
              ("db.prepare('UPDATE users SET shift_name = ?, worker_status = ?, updated_at = ? WHERE id = ?').run(\n          shiftType,\n          mappedWorkerStatus,\n          now,\n          worker.id,\n        );", "db.prepare('UPDATE users SET shift_name = ?, phone = COALESCE(?, phone), worker_status = ?, updated_at = ? WHERE id = ?').run(\n          shiftType,\n          phone,\n          mappedWorkerStatus,\n          now,\n          worker.id,\n        );"),
              ("details: `${worker.name} · ${shiftDate} · ${shiftType} · ${status}`,", "details: `${worker.name} · ${shiftDate} · ${shiftType} · ${status}${phone ? ` · هاتف: ${phone}` : ''}`,"),
              ("          shiftType,\n          status,\n          notes,\n          recordedByName", "          shiftType,\n          phone,\n          status,\n          notes,\n          recordedByName"),
          ])
          patch("src/types.ts", [
              ("  shiftType: string;\n  status: 'نشط' | 'غائب' | 'مكتمل';", "  shiftType: string;\n  phone: string | null;\n  status: 'نشط' | 'غائب' | 'مكتمل';"),
          ])
          patch("src/api.ts", [
              ("    shiftType: string;\n    status: 'نشط' | 'غائب' | 'مكتمل';\n    notes?: string;", "    shiftType: string;\n    phone?: string;\n    status: 'نشط' | 'غائب' | 'مكتمل';\n    notes?: string;"),
          ])
          patch("src/components/AdminManagementView.tsx", [
              ("  const [shiftWorkerId, setShiftWorkerId] = useState('');", "  const [shiftWorkerId, setShiftWorkerId] = useState('');\n  const [shiftPhone, setShiftPhone] = useState('');"),
              ("      if (firstWorker && !shiftWorkerId) {\n        setShiftWorkerId(firstWorker.id);\n      }", "      if (firstWorker && !shiftWorkerId) {\n        setShiftWorkerId(firstWorker.id);\n        setShiftPhone(firstWorker.phone || '');\n      }"),
              ("        shiftType,\n        status: shiftStatus,\n        notes: shiftNotes.trim(),", "        shiftType,\n        phone: shiftPhone.trim(),\n        status: shiftStatus,\n        notes: shiftNotes.trim(),"),
              ("                    onChange={(e) => setShiftWorkerId(e.target.value)}", "                    onChange={(e) => {\n                      const nextWorkerId = e.target.value;\n                      setShiftWorkerId(nextWorkerId);\n                      setShiftPhone(workerUsers.find((worker) => worker.id === nextWorkerId)?.phone || '');\n                    }}"),
              ("                <div>\n                  <label htmlFor=\"sh-date\"", "                <div>\n                  <label htmlFor=\"sh-phone\" className=\"block text-xs font-semibold text-slate-700 mb-1\">\n                    رقم هاتف التواصل لهذه الوردية (واتساب)\n                  </label>\n                  <input\n                    id=\"sh-phone\"\n                    type=\"tel\"\n                    dir=\"ltr\"\n                    value={shiftPhone}\n                    onChange={(e) => setShiftPhone(e.target.value)}\n                    placeholder=\"مثال: 9705XXXXXXXX\"\n                    className=\"w-full rounded-lg border border-slate-300 px-3 py-2 text-sm\"\n                  />\n                  <p className=\"mt-1 text-[11px] text-slate-500\">يمكن تغييره مع كل وردية. عند الحفظ يصبح هذا رقم التواصل الحالي للعامل.</p>\n                </div>\n\n                <div>\n                  <label htmlFor=\"sh-date\""),
              ("                      <th className=\"px-4 py-3\">الوردية</th>\n                      <th className=\"px-4 py-3\">الحالة</th>", "                      <th className=\"px-4 py-3\">الوردية</th>\n                      <th className=\"px-4 py-3\">رقم الهاتف</th>\n                      <th className=\"px-4 py-3\">الحالة</th>"),
              ("                        <td className=\"px-4 py-3 text-xs text-slate-700\">{s.shiftType}</td>\n                        <td className=\"px-4 py-3 text-xs font-semibold\">", "                        <td className=\"px-4 py-3 text-xs text-slate-700\">{s.shiftType}</td>\n                        <td className=\"px-4 py-3 font-mono text-xs text-slate-600\" dir=\"ltr\">{s.phone || '—'}</td>\n                        <td className=\"px-4 py-3 text-xs font-semibold\">"),
          ])
          PY
      - name: Add live operations monitor entry point
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("src/App.tsx")
          s = p.read_text()
          replacements = [
              ("  BarChart3,\n", "  Activity,\n  BarChart3,\n"),
              ("import {LoginView, SetupAdminView} from './components/AuthViews.tsx';\n", "import {LoginView, SetupAdminView} from './components/AuthViews.tsx';\nimport {LiveMonitorView} from './components/LiveMonitorView.tsx';\n"),
              ("type ActiveSection = 'dashboard' | 'reports' | 'admin' | 'qr-codes' | 'new-request';", "type ActiveSection = 'dashboard' | 'live-monitor' | 'reports' | 'admin' | 'qr-codes' | 'new-request';"),
              ("            {id: 'admin', label: 'إدارة الطاقم والأقسام', icon: <SlidersHorizontal className=\"w-4 h-4\" />},\n", "            {id: 'admin', label: 'إدارة الطاقم والأقسام', icon: <SlidersHorizontal className=\"w-4 h-4\" />},\n            {id: 'live-monitor', label: 'المراقبة المباشرة', icon: <Activity className=\"w-4 h-4\" />},\n"),
              ("          ) : activeSection === 'reports' ? (\n            <ReportsView />", "          ) : activeSection === 'live-monitor' && user.role === 'admin' ? (\n            <LiveMonitorView requests={requests} workers={workers} departments={departments} loading={loadingData} onRefresh={() => loadWorkspaceData(user)} />\n          ) : activeSection === 'reports' ? (\n            <ReportsView />"),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f"Live monitor patch could not find expected App.tsx fragment: {old[:100]!r}")
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Add nursing QR status reporting
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f"Could not apply nursing QR status patch to {path}: missing {old[:100]!r}")
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch("server/db.ts", [
              ("  CREATE TABLE IF NOT EXISTS audit_logs (", """  CREATE TABLE IF NOT EXISTS nursing_status_reports (
            id TEXT PRIMARY KEY,
            department_id TEXT NOT NULL,
            status TEXT NOT NULL CHECK (status IN ('العامل متأخر ولم يحضر', 'تم إنجاز المهمة', 'لم يتم إنجاز المهمة بعد')),
            location TEXT NOT NULL DEFAULT '',
            note TEXT NOT NULL DEFAULT '',
            created_at TEXT NOT NULL,
            FOREIGN KEY (department_id) REFERENCES departments(id)
          );

          CREATE INDEX IF NOT EXISTS idx_nursing_status_reports_created ON nursing_status_reports(created_at);
          CREATE INDEX IF NOT EXISTS idx_nursing_status_reports_department ON nursing_status_reports(department_id);

          CREATE TABLE IF NOT EXISTS audit_logs ("""),
          ])

          patch("src/types.ts", [
              ("export interface AuditLogEntry {", """export type NursingStatusChoice = 'العامل متأخر ولم يحضر' | 'تم إنجاز المهمة' | 'لم يتم إنجاز المهمة بعد';

          export interface NursingStatusReport {
            id: string;
            departmentId: string;
            departmentName: string;
            status: NursingStatusChoice;
            location: string;
            note: string;
            createdAt: string;
          }

          export interface AuditLogEntry {"""),
          ])

          patch("src/api.ts", [
              ("  ReportData,\n", "  ReportData,\n  NursingStatusChoice,\n  NursingStatusReport,\n"),
              ("  getRequests: () => apiFetch<{requests: CleaningRequest[]}>('/api/requests'),", """  submitNursingStatusReport: (payload: {
    departmentId: string;
    status: NursingStatusChoice;
    location?: string;
    note?: string;
  }) => apiFetch<{report: NursingStatusReport}>('/api/public/nursing-status-reports', {
    method: 'POST',
    body: JSON.stringify(payload),
  }),

  getNursingStatusReports: () => apiFetch<{reports: NursingStatusReport[]}>('/api/nursing-status-reports'),

  getRequests: () => apiFetch<{requests: CleaningRequest[]}>('/api/requests'),"""),
          ])

          patch("server/routes.ts", [
              ("  // Authenticated requests listing (strict server-side RBAC filtering!)", """  // Public QR status report from nursing staff. This records feedback without changing the worker's task status.
  app.post('/api/public/nursing-status-reports', (req: Request, res: Response) => {
    const departmentId = sanitizeText(req.body?.departmentId, 64);
    const status = sanitizeText(req.body?.status, 80);
    const location = sanitizeText(req.body?.location, 120);
    const note = sanitizeText(req.body?.note, 400);
    const allowedStatuses = ['العامل متأخر ولم يحضر', 'تم إنجاز المهمة', 'لم يتم إنجاز المهمة بعد'];
    if (!departmentId || !allowedStatuses.includes(status)) {
      res.status(400).json({error: 'يرجى تحديد القسم وحالة العامل أو المهمة.'});
      return;
    }
    const dept = db.prepare('SELECT id, name, is_active FROM departments WHERE id = ?').get(departmentId) as
      | {id: string; name: string; is_active: number}
      | undefined;
    if (!dept || dept.is_active !== 1) {
      res.status(404).json({error: 'القسم غير موجود أو غير نشط.'});
      return;
    }
    const id = `NUR-${crypto.randomUUID().slice(0, 8).toUpperCase()}`;
    const now = new Date().toISOString();
    db.prepare(
      'INSERT INTO nursing_status_reports (id, department_id, status, location, note, created_at) VALUES (?, ?, ?, ?, ?, ?)',
    ).run(id, departmentId, status, location, note, now);
    writeAuditLog({
      actorId: null,
      actorName: 'طاقم التمريض عبر رمز QR',
      actorRole: 'qr_form',
      action: 'تسجيل بلاغ حالة عامل أو مهمة من التمريض',
      entityType: 'nursing_status_report',
      entityId: id,
      details: `${dept.name} · ${status}${location ? ` · الموقع: ${location}` : ''}${note ? ` · ملاحظة: ${note}` : ''}`,
    });
    res.status(201).json({
      report: {id, departmentId, departmentName: dept.name, status, location, note, createdAt: now},
    });
  });

  // Admin and supervisor review of nursing QR status reports.
  app.get('/api/nursing-status-reports', requireAuth, requireRole(['admin', 'supervisor']), (_req: AuthenticatedRequest, res: Response) => {
    const rows = db.prepare(
      `SELECT n.id, n.department_id, d.name AS department_name, n.status, n.location, n.note, n.created_at
       FROM nursing_status_reports n JOIN departments d ON d.id = n.department_id
       ORDER BY n.created_at DESC LIMIT 100`,
    ).all() as Array<{
      id: string; department_id: string; department_name: string; status: string;
      location: string; note: string; created_at: string;
    }>;
    res.json({reports: rows.map((row) => ({
      id: row.id,
      departmentId: row.department_id,
      departmentName: row.department_name,
      status: row.status,
      location: row.location,
      note: row.note,
      createdAt: row.created_at,
    }))});
  });

  // Authenticated requests listing (strict server-side RBAC filtering!)"""),
          ])

          patch("src/components/CleaningRequestForm.tsx", [
              ("import type {CleaningRequest, Department, RequestPriority} from '../types.ts';", "import type {CleaningRequest, Department, NursingStatusChoice, RequestPriority} from '../types.ts';"),
              ("  const [nowClock, setNowClock] = useState(() => new Date().toISOString());", """  const [nowClock, setNowClock] = useState(() => new Date().toISOString());
  const [nursingStatus, setNursingStatus] = useState<NursingStatusChoice>('لم يتم إنجاز المهمة بعد');
  const [nursingLocation, setNursingLocation] = useState('');
  const [nursingNote, setNursingNote] = useState('');
  const [nursingSubmitting, setNursingSubmitting] = useState(false);
  const [nursingMessage, setNursingMessage] = useState<string | null>(null);"""),
              ("  const handleReset = () => {", """  const handleNursingStatusSubmit = async (e: React.FormEvent) => {
    e.preventDefault();
    if (!departmentId || nursingSubmitting) return;
    setNursingSubmitting(true);
    setNursingMessage(null);
    try {
      await api.submitNursingStatusReport({
        departmentId,
        status: nursingStatus,
        location: nursingLocation.trim(),
        note: nursingNote.trim(),
      });
      setNursingMessage('تم تسجيل البلاغ بنجاح، وسيظهر لدى المشرف والإدارة.');
      setNursingNote('');
    } catch (err) {
      setNursingMessage(err instanceof Error ? err.message : 'تعذر تسجيل البلاغ. حاول مرة أخرى.');
    } finally {
      setNursingSubmitting(false);
    }
  };

  const handleReset = () => {"""),
              ("        <form onSubmit={handleSubmit} className=\"mt-6 space-y-5\">", """        <>
        {!isAuthenticated && initialDeptId && (
          <section className="mt-6 rounded-xl border border-teal-200 bg-teal-50/60 p-4">
            <h3 className="font-bold text-slate-900">متابعة حالة عامل النظافة أو المهمة</h3>
            <p className="mt-1 text-xs text-slate-600">اختر الحالة لإرسال بلاغ للقسم والمشرف. هذا البلاغ لا يغلق المهمة تلقائياً؛ يعتمد المشرف أو العامل إتمامها في النظام.</p>
            <form onSubmit={handleNursingStatusSubmit} className="mt-4 space-y-3">
              <label htmlFor="nursing-status" className="block text-sm font-semibold text-slate-800">حالة العامل / المهمة</label>
              <select id="nursing-status" value={nursingStatus} onChange={(e) => setNursingStatus(e.target.value as NursingStatusChoice)} className="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm">
                <option value="العامل متأخر ولم يحضر">العامل متأخر ولم يحضر</option>
                <option value="تم إنجاز المهمة">تم إنجاز المهمة</option>
                <option value="لم يتم إنجاز المهمة بعد">لم يتم إنجاز المهمة بعد</option>
              </select>
              <input value={nursingLocation} onChange={(e) => setNursingLocation(e.target.value)} maxLength={120} placeholder="الغرفة أو الموقع (اختياري)" className="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm" />
              <textarea value={nursingNote} onChange={(e) => setNursingNote(e.target.value)} maxLength={400} rows={2} placeholder="ملاحظة إضافية (اختياري، دون بيانات المرضى)" className="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm" />
              {nursingMessage && <p role="status" className="text-sm font-medium text-teal-800">{nursingMessage}</p>}
              <button type="submit" disabled={nursingSubmitting} className="w-full rounded-lg bg-teal-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-teal-800 disabled:opacity-60">
                {nursingSubmitting ? 'جاري تسجيل البلاغ...' : 'إرسال بلاغ الحالة'}
              </button>
            </form>
          </section>
        )}

        <form onSubmit={handleSubmit} className="mt-6 space-y-5">"""),
              ("""        </form>
      )}
    </div>""", """        </form>
        </>
      )}
    </div>"""),
          ])

          patch("src/components/LiveMonitorView.tsx", [
              ("import React, {useMemo} from 'react';\nimport type {CleaningRequest, Department, WorkerSummary} from '../types.ts';", "import React, {useEffect, useMemo, useState} from 'react';\nimport {api, formatArabicDateTime} from '../api.ts';\nimport type {CleaningRequest, Department, NursingStatusReport, WorkerSummary} from '../types.ts';"),
              ("  const metrics = useMemo(() => {", """  const [nursingReports, setNursingReports] = useState<NursingStatusReport[]>([]);
  const [nursingReportsError, setNursingReportsError] = useState<string | null>(null);

  const loadNursingReports = async () => {
    try {
      const result = await api.getNursingStatusReports();
      setNursingReports(result.reports);
      setNursingReportsError(null);
    } catch (error) {
      setNursingReportsError(error instanceof Error ? error.message : 'تعذر تحميل بلاغات التمريض');
    }
  };

  useEffect(() => {
    void loadNursingReports();
  }, []);

  const metrics = useMemo(() => {"""),
              ("        <button type=\"button\" onClick={onRefresh} className=\"inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50\">", "        <button type=\"button\" onClick={() => { onRefresh(); void loadNursingReports(); }} className=\"inline-flex items-center gap-2 rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50\">"),
              ("      <div className=\"grid gap-4 xl:grid-cols-2\">", """      <section className="rounded-xl border border-slate-200 bg-white p-4">
        <div className="flex items-center justify-between gap-3">
          <div>
            <h3 className="font-bold text-slate-900">آخر بلاغات التمريض عبر QR</h3>
            <p className="mt-1 text-xs text-slate-500">آخر 100 بلاغ مسجل، مرتبة من الأحدث</p>
          </div>
          <span className="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-700">{nursingReports.length} بلاغ</span>
        </div>
        {nursingReportsError ? <p className="py-4 text-sm text-red-700">{nursingReportsError}</p> : nursingReports.length === 0 ? (
          <p className="py-6 text-center text-sm text-slate-500">لا توجد بلاغات تمريض مسجلة حتى الآن.</p>
        ) : (
          <ul className="mt-3 divide-y divide-slate-100">
            {nursingReports.slice(0, 12).map((report) => (
              <li key={report.id} className="flex flex-wrap items-start justify-between gap-2 py-3">
                <div className="min-w-0">
                  <p className="text-sm font-semibold text-slate-900">{report.departmentName} · {report.status}</p>
                  {report.location && <p className="mt-1 text-xs text-slate-600">الموقع: {report.location}</p>}
