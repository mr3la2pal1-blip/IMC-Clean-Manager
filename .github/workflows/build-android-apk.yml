name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'capacitor.config.ts'
      - '.github/workflows/build-android-apk.yml'
      - 'package.json'
      - 'src/**'
      - 'public/**'
    branches: [main]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Capacitor JSON config for CI
        run: |
          rm -f capacitor.config.ts
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.imc.cleanmanager",
            "appName": "IMC Clean Manager",
            "webDir": "dist",
            "android": { "allowMixedContent": false },
            "server": {
              "androidScheme": "https",
              "url": "https://imc-clean-manager-mhdt.onrender.com",
              "cleartext": false
            }
          }
          JSON

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMC-Clean-Manager-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.0.${{ github.run_number }}
          name: IMC Clean Manager Android APK v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
